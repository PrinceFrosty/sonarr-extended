name: Get latest release version
on:
   push:
    branches: [ "latest" ]
    # Publish semver tags as releases.
    tags: [ 'v*.*.*' ]
   pull_request:
    branches: [ "latest" ]
   schedule:
    - cron:  '13 */8 * * *'
jobs:
  get-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Fetch release version
        run: |
          curl -sL https://api.github.com/repos/linuxserver/docker-sonarr/releases/latest | \
          jq -r ".tag_name" > latest-sonarr.txt
      - name: Check for modified files
        id: git-check
        run: echo "modified=$([ -z "`git status --porcelain`" ] && echo "false" || echo "true")" >> $GITHUB_OUTPUT
        if: steps.git-check.outputs.modified == 'true'
      - name: Commit latest release version
        continue-on-error: true
        run: |
          git config --global user.name 'PrinceFrosty'
          git config --global user.email '33556237+PrinceFrosty@users.noreply.github.com'
          git commit -am "New release version"
          git push
